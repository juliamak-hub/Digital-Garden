# Introductie
Ik heb interesse in de lelieveredeling. Mijn familie heeft bijna 60 jaar ervaring 
in de veredeling en ontwikkeling van hybride lelies. Ik weet er nog weinig van en wil me hierin verdiepen.
<br><br>
<img width="350" height="250" alt="kas met lelies" src="https://lilylooks.nl/wp-content/uploads/2023/08/proeven-1.jpg"/>

#Geschiedenis
Lelies zijn al duizende jaren aanwezig in het leven van mensen. Je ziet ze terug op oude schilderingen en in mythen die stammen uit de tijd van de Grieken en Romeinen. De lelie stond ooit symbool voor zuiverheid, kracht en liefde. Door de eeuwen heen reisden leliebollen mee met
ontdekkingsreizigers, wat zorgde voor verspreiding over alle continenten.
<br><br>
<a href="https://ishs.org/ishs-article/414_2/">Economische data en opbrengsten van lelies door de jaren heen</a>

---

#Soorten lelies
De lelie is een van de meest diverse bloem die er bestaat. Je treft ze in verschillende bloemgrootte, kleuren, printen, van niet geurend tot sterk geurend, enkele lelies, dubbele lelies.
Al deze lelies zijn te verdelen in verschillende typen, zoals: Aziaat, Oriental, Trompet en Longiflorum. Wil je dieper op de lelie soorten ingaan

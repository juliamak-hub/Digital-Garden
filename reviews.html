<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Julia Mak" />
    <meta name="color-scheme" content="dark light" />

    <title>[Digitaal Tuintje van Julia Mak]</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->

      data-page="[https://voorbeeld.nl]"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>
  <body>
    <header>
      <h1>Julia's digital garden</h1>

      <form>
        <label for="system-mode">
          <input
            type="radio"
            id="system-mode"
            name="color-scheme"
            value="auto"
            checked
          />
          auto
        </label>
        <label for="light-mode">
          <input
            type="radio"
            id="light-mode"
            name="color-scheme"
            value="light"
          />
          Licht
        </label>
        <label for="dark-mode">
          <input type="radio" id="dark-mode" name="color-scheme" value="dark" />
          Donker
        </label>
      </form>

      <nav>
        <ul>
          <li><a href="/">[Home]</a></li>
          <li><a href="/log.html">[Log]</a></li>
          <li><a href="/reviews.html">[Reviews]</a></li>
          <li><a href="/contact.html">[Contact]</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <article>
        <h2>Review van Julia Mak</h2>
        <p>Deze website is top!!
        </p>
      </article>
    </main>


    <footer>
      <p>[Copyleft 2026, all wrongs reversed]</p>
    </footer>
  </body>
